<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="iforge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0071E3"/>
      <stop offset="100%" style="stop-color:#2EC5FF"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="#0A1628"/>
  <!-- I letterform - geometric -->
  <rect x="120" y="120" width="64" height="272" rx="8" fill="url(#iforge-grad)"/>
  <!-- F letterform - geometric, interlocking with I -->
  <rect x="208" y="120" width="184" height="56" rx="8" fill="url(#iforge-grad)"/>
  <rect x="208" y="192" width="120" height="56" rx="8" fill="url(#iforge-grad)"/>
  <rect x="208" y="264" width="184" height="56" rx="8" fill="url(#iforge-grad)"/>
  <!-- Accent spark - forge element -->
  <circle cx="416" cy="360" r="32" fill="#2EC5FF" opacity="0.9"/>
  <circle cx="416" cy="360" r="16" fill="#0A1628"/>
</svg>
