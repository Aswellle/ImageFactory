version: "2"

linters:
  default: none
  enable:
    - errcheck        # unchecked errors
    - govet           # suspicious constructs
    - ineffassign     # unused assignments
    - staticcheck     # static analysis
    - unused          # unused code
    - misspell        # typos
    - revive          # style
    - gosec           # security
    # wrapcheck 禁用：对 defer rows.Close() 等过于严格

  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - disableStutteringCheck
        - name: package-comments
          disabled: true
        - name: unused-receiver
          disabled: true
    gosec:
      excludes:
        - G115 # integer conversion overflow
        - G101 # credential patterns (false positives on context key names)

  exclusions:
    paths:
      - ent          # generated code
      - migrations   # SQL files
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      - path: cmd/
        linters:
          - gosec
          - errcheck
          - wrapcheck
      # defer 语句中的错误检查使用 nolint 注释
      - source: "defer .*Close\(\)"
        linters:
          - errcheck
      - path: internal/batchimage/
        linters:
          - revive # 移植代码暂不强制注释
      - path: internal/service/scheduling/
        linters:
          - revive # 移植代码暂不强制注释

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
    goimports:
      local-prefixes:
        - github.com/imageforge/imageforge
