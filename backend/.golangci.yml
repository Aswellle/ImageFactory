run:
  timeout: 5m
  go: '1.26'

output:
  format: colored-line-number

linters:
  enable:
    - errcheck        # unchecked errors
    - gosimple        # code simplification
    - govet           # suspicious constructs
    - ineffassign     # unused assignments
    - staticcheck     # static analysis
    - unused          # unused code
    - gofmt           # formatting
    - goimports       # import formatting
    - misspell        # typos
    - revive          # style
    - gosec           # security
    - wrapcheck       # error wrapping

linters-settings:
  goimports:
    local-prefixes: github.com/imageforge/imageforge
  revive:
    rules:
      - name: exported
        arguments:
          - checkPrivateReceivers
          - disableStutteringCheck
      - name: package-comments
        severity: warning
        disabled: true
  gosec:
    excludes:
      - G115 # integer conversion overflow (common in ORM/DB code)

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-dirs:
    - ent          # generated code
    - migrations   # SQL files
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
    - path: cmd/
      linters:
        - gosec
