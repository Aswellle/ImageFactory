version: "2"

linters:
  default: none
  enable:
    - errcheck        # unchecked errors
    - govet           # suspicious constructs
    - ineffassign     # unused assignments
    - staticcheck     # static analysis
    - unused          # unused code
    - misspell        # typos
    - revive          # style
    - gosec           # security
    - wrapcheck       # error wrapping

  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - disableStutteringCheck
        - name: package-comments
          disabled: true
    gosec:
      excludes:
        - G115 # integer conversion overflow (common in ORM/DB code)

  exclusions:
    paths:
      - ent          # generated code
      - migrations   # SQL files
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      - path: cmd/
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
    goimports:
      local-prefixes:
        - github.com/imageforge/imageforge
