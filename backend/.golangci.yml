version: "2"

linters:
  default: none
  enable:
    - govet           # suspicious constructs (essential)
    - ineffassign     # unused assignments (essential)
    - staticcheck     # static analysis (essential)
    - unused          # unused code (essential)
    - misspell       # typos (essential)
    - gofmt           # formatting (essential)
    # 以下规则过于严格，对移植代码不适用，已禁用：
    # - errcheck: defer 错误检查在资源清理场景过于严格
    # - revive: 导出类型注释要求对移植代码过于繁琐
    # - gosec: 部分规则（G404 随机数、G101 凭证模式）误报率高
    # - wrapcheck: 错误包装要求对过于严格

  settings:
    unused:
      # 导出类型在未使用时仅警告不报错
      exported-fields-are-used: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
    goimports:
      local-prefixes:
        - github.com/imageforge/imageforge
