name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: lint + test ──────────────────────────────────────────────
  backend:
    name: Backend (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26', '1.27']

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: imageforge
          POSTGRES_PASSWORD: imageforge
          POSTGRES_DB: imageforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run golangci-lint
        uses: golangci-lint/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend
          args: --timeout=5m

      - name: Run unit tests
        working-directory: backend
        run: go test -tags=unit -v -race -coverprofile=coverage.out ./...

      - name: Run integration tests
        working-directory: backend
        env:
          IF_DATABASE_HOST: localhost
          IF_DATABASE_PORT: 5432
          IF_DATABASE_USER: imageforge
          IF_DATABASE_PASSWORD: imageforge
          IF_DATABASE_DBNAME: imageforge_test
          IF_DATABASE_SSLMODE: disable
          IF_SERVER_MODE: release
          IF_AUTH_JWT_SECRET: test-secret-for-ci-only
        run: go test -tags=integration -v ./...

      - name: Upload coverage
        if: matrix.go-version == '1.26'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 7

  # ── Frontend: typecheck + lint + build ────────────────────────────────
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '23']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --active)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: frontend
        run: pnpm typecheck

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        run: pnpm build

  # ── Docker build ──────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: imageforge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image runs
        run: |
          docker run --rm imageforge:ci --help 2>/dev/null || \
          docker run --rm imageforge:ci 2>&1 | head -5 || true

  # ── Summary ───────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: always()

    steps:
      - name: All checks passed
        if: ${{ needs.backend.result == 'success' && needs.frontend.result == 'success' && needs.docker.result == 'success' }}
        run: echo "✅ All CI checks passed"

      - name: Some checks failed
        if: ${{ needs.backend.result != 'success' || needs.frontend.result != 'success' || needs.docker.result != 'success' }}
        run: |
          echo "❌ CI failed:"
          echo "  Backend:  ${{ needs.backend.result }}"
          echo "  Frontend: ${{ needs.frontend.result }}"
          echo "  Docker:   ${{ needs.docker.result }}"
          exit 1
