# ImageForge services: backend, frontend, postgres, redis, minio.
# MinIO provides an S3-compatible API for local object storage (dev only).
#
# Usage:
#   docker compose up -d        # start all services
#   docker compose logs -f backend

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-imageforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-imageforge}
      POSTGRES_DB: ${DB_NAME:-imageforge}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-imageforge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      IF_SERVER_HOST: 0.0.0.0
      IF_SERVER_PORT: 8080
      IF_DATABASE_HOST: db
      IF_DATABASE_PORT: 5432
      IF_DATABASE_USER: ${DB_USER:-imageforge}
      IF_DATABASE_PASSWORD: ${DB_PASSWORD:-imageforge}
      IF_DATABASE_NAME: ${DB_NAME:-imageforge}
      IF_REDIS_HOST: redis
      IF_REDIS_PORT: 6379
      IF_AUTH_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      IF_STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      IF_STORAGE_ENDPOINT: http://minio:9000
      IF_STORAGE_BUCKET: ${STORAGE_BUCKET:-imageforge}
      IF_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      IF_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      IF_SUB2API_BASE_URL: ${SUB2API_BASE_URL:-}
      IF_SUB2API_ADMIN_API_KEY: ${SUB2API_ADMIN_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\";
        mc mb --ignore-existing local/$${STORAGE_BUCKET:-imageforge};
        echo 'bucket ready';
      "

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev --host"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      IF_API_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  minio_data:
  frontend_node_modules:
